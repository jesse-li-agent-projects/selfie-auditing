[project]
name = "selfie_taboo"
version = "0.1.0"
description = "SelfIE adapter probe of Taboo fine-tuned models -- see plans/selfie_taboo_pipeline.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.20",
    "safetensors>=0.3",
    "huggingface-hub>=0.20",
    "jaxtyping>=0.2",
    # Not on PyPI (confirmed: pypi.org/pypi/selfie-adapters/json returns 404,
    # research_notes_selfie_mechanism.md S1.5) -- install from GitHub directly.
    "selfie-adapters @ git+https://github.com/agencyenterprise/selfie-adapters.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["selfie_taboo*", "smoke*"]
