[pytest]
# Both markers are deselected by default so a plain `pytest` stays fast, and
# needs no network, no model weights and no GPU. Run them explicitly with
# `pytest -m hf_cache` / `pytest -m gpu` on a machine that has the smoke model
# in its Hugging Face cache.
markers =
    hf_cache: needs the 1B smoke model in the local HF cache (no GPU needed)
    gpu: needs a local CUDA device as well as the cached smoke model
addopts = -m "not gpu and not hf_cache"
